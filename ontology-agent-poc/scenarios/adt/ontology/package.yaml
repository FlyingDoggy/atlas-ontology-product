rules:
  - id: rule.eligible_trade
    status: confirmed
    name: {en: Eligible Trade, zh: 合资格成交}
    definition: Includes executed trades and excludes cancelled records.
    owner: actor.domain_owner
    sources: [source.metric_logic, source.existing_sql]
    decisions: [decision.eligible_trade]
    rule_type: eligibility
    all:
      - {property: property.trade.status, op: eq, value: EXECUTED}
      - {property: property.trade.cancellation_flag, op: is_false}
    failure_behavior: exclude
  - id: rule.trading_day
    status: confirmed
    name: {en: Approved Trading Day, zh: 合资格交易日}
    definition: Includes calendar rows explicitly marked as trading days.
    owner: actor.domain_owner
    sources: [source.metric_logic]
    decisions: [decision.calendar_day]
    rule_type: calendar
    all:
      - {property: property.calendar.is_trading_day, op: is_true}
    failure_behavior: exclude

metrics:
  - id: metric.eligible_turnover
    status: confirmed
    name: {en: Eligible Turnover, zh: 合资格成交额}
    definition: Sum of executed value for eligible trades in the governed period.
    owner: actor.domain_owner
    sources: [source.metric_logic, source.existing_sql]
    metric_type: base
    base_entity: entity.trade
    result_grain: [dimension.period]
    value_type: decimal
    unit: HKD_MN
    aggregation_semantics: additive
    formula:
      op: sum
      args: [{op: field_ref, ref: property.trade.executed_value_hkd_mn}]
    query:
      base_source: source.trade_fact
      measure_property: property.trade.executed_value_hkd_mn
      period_property: property.calendar.period_id
      date_property: property.calendar.calendar_date
      population_property: property.calendar.market_id
      required_joins: [join.trade_calendar]
      filters: [rule.eligible_trade]
    allowed_dimensions: [dimension.period, dimension.segment]
    null_policy: fail_validation
    zero_denominator_policy: refuse
  - id: metric.trading_day_count
    status: confirmed
    name: {en: Trading Day Count, zh: 交易日数}
    definition: Count of distinct approved trading dates in the governed period.
    owner: actor.domain_owner
    sources: [source.metric_logic]
    decisions: [decision.calendar_day, decision.half_day]
    metric_type: base
    base_entity: entity.trading_day
    result_grain: [dimension.period]
    value_type: integer
    unit: TRADING_DAY_COUNT
    aggregation_semantics: semi_additive
    formula:
      op: count_distinct
      args: [{op: field_ref, ref: property.calendar.calendar_date}]
    query:
      base_source: source.trading_calendar
      measure_property: property.calendar.calendar_date
      period_property: property.calendar.period_id
      date_property: property.calendar.calendar_date
      population_property: property.calendar.market_id
      filters: [rule.trading_day]
    allowed_dimensions: [dimension.period]
    null_policy: fail_validation
    zero_denominator_policy: refuse
  - id: metric.average_daily_turnover
    status: confirmed
    name: {en: Average Daily Turnover, zh: 平均每日成交额}
    definition: Eligible turnover divided by the distinct approved trading-day count for the same period.
    owner: actor.domain_owner
    sources: [source.metric_logic]
    decisions: [decision.calendar_day, decision.eligible_trade]
    metric_type: derived
    base_entity: entity.trade
    result_grain: [dimension.period]
    value_type: decimal
    unit: HKD_MN_PER_TRADING_DAY
    aggregation_semantics: derived_non_additive
    formula:
      op: divide
      args:
        - {op: metric_ref, ref: metric.eligible_turnover}
        - {op: metric_ref, ref: metric.trading_day_count}
    query: {}
    allowed_dimensions: [dimension.period, dimension.segment]
    null_policy: fail_validation
    zero_denominator_policy: refuse

