decisions:
  - id: decision.calendar_day
    question: What counts as the ADT denominator?
    options: [Distinct approved trading dates, Dates with trades, Calendar days]
    decision: Count distinct dates in the governed trading calendar where is_trading_day is true.
    decided_by: actor.domain_owner
    decided_on: 2026-08-18
    affects: [metric.trading_day_count, metric.average_daily_turnover]
  - id: decision.half_day
    question: How does a half trading day contribute to the denominator?
    options: [One day, Half day, Exclude]
    decision: Count an approved half trading day as one trading day in this synthetic reference case.
    decided_by: actor.domain_owner
    decided_on: 2026-08-18
    affects: [metric.trading_day_count]
    residual_assumption: A real customer scenario must reconfirm this convention.
  - id: decision.eligible_trade
    question: Which trade records contribute to turnover?
    options: [Executed only, All statuses, Executed including cancellations]
    decision: Include status EXECUTED and exclude cancellation_flag true.
    decided_by: actor.domain_owner
    decided_on: 2026-08-18
    affects: [rule.eligible_trade, metric.eligible_turnover]
  - id: decision.segment_contribution
    question: What does segment contribution refer to?
    options: [Turnover delta, ADT delta, Share of Q4 turnover]
    decision: Contribution is each segment turnover delta divided by total turnover delta.
    decided_by: actor.domain_owner
    decided_on: 2026-08-18
    affects: [analysis.segment_contribution]
  - id: decision.decomposition
    question: Which turnover decomposition convention is used?
    options: [Sequential calendar first, Sequential activity first, Shapley]
    decision: Use sequential calendar-first decomposition and disclose that it is order-dependent and non-causal.
    decided_by: actor.domain_owner
    decided_on: 2026-08-18
    affects: [analysis.sequential_decomposition]

