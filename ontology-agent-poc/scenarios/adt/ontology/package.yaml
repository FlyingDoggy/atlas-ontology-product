joins:
  - id: join.trade_calendar
    status: confirmed
    name: {en: Trade to Calendar Join, zh: 成交到日历关联}
    definition: Resolves each trade date to exactly one governed calendar row.
    owner: actor.data_steward
    sources: [source.data_model, source.existing_sql]
    left_source: source.trade_fact
    left_table: trade_fact
    right_source: source.trading_calendar
    right_table: trading_calendar
    keys:
      - {left_column: market_id, right_column: market_id}
      - {left_column: trade_date, right_column: calendar_date}
    expected_cardinality: N:1
    fanout_policy: block
  - id: join.trade_instrument
    status: confirmed
    name: {en: Trade to Instrument Join, zh: 成交到证券关联}
    definition: Resolves each trade to exactly one instrument and segment.
    owner: actor.data_steward
    sources: [source.data_model, source.existing_sql]
    left_source: source.trade_fact
    left_table: trade_fact
    right_source: source.instrument_dim
    right_table: instrument_dim
    keys:
      - {left_column: instrument_id, right_column: instrument_id}
    expected_cardinality: N:1
    fanout_policy: block

analysis_patterns:
  - {id: analysis.metric_fact, status: confirmed, name: {en: Metric Fact, zh: 指标事实}, definition: Returns a governed metric for one or more explicit periods., owner: actor.domain_owner, sources: [source.requirements], intent: metric_fact, operation: MetricFact, required_metrics: [metric.average_daily_turnover], required_dimensions: [dimension.period], exactly_two_periods: false, output_fields: [period, turnover, trading_days, adt], failure_conditions: [missing_period, zero_denominator]}
  - {id: analysis.period_compare, status: confirmed, name: {en: Exact Period Compare, zh: 精确期间比较}, definition: Compares ADT and turnover across exactly two periods., owner: actor.domain_owner, sources: [source.requirements], intent: period_compare, operation: ExactPeriodCompare, required_metrics: [metric.average_daily_turnover], required_dimensions: [dimension.period], exactly_two_periods: true, output_fields: [current, previous, delta, delta_pct], failure_conditions: [overlapping_periods, missing_period]}
  - {id: analysis.segment_contribution, status: confirmed, name: {en: Segment Contribution, zh: 板块贡献}, definition: Reconciles segment turnover deltas and ranks contribution to total turnover change., owner: actor.domain_owner, sources: [source.requirements, source.metric_logic], decisions: [decision.segment_contribution], intent: segment_contribution, operation: SegmentNetChangeShare, required_metrics: [metric.eligible_turnover], required_dimensions: [dimension.segment, dimension.period], exactly_two_periods: true, output_fields: [segment, previous, current, delta, contribution_share], failure_conditions: [segments_do_not_reconcile]}
  - {id: analysis.sequential_decomposition, status: confirmed, name: {en: Calendar-first Decomposition, zh: 日历优先分解}, definition: Decomposes turnover change into trading-day and activity effects using a disclosed sequential convention., owner: actor.domain_owner, sources: [source.requirements], decisions: [decision.decomposition], intent: sequential_decomposition, operation: SequentialCalendarFirst, required_metrics: [metric.eligible_turnover, metric.trading_day_count, metric.average_daily_turnover], required_dimensions: [dimension.period], exactly_two_periods: true, output_fields: [calendar_effect, activity_effect, residual], failure_conditions: [non_closing_residual]}
  - {id: analysis.evidence_audit, status: confirmed, name: {en: Evidence Audit, zh: 证据审计}, definition: "Returns definition, mapping, validation and execution evidence for the governed answer.", owner: actor.domain_owner, sources: [source.requirements], intent: evidence_audit, operation: EvidenceAudit, required_metrics: [metric.average_daily_turnover], exactly_two_periods: false, output_fields: [definition, formula, mappings, validation, execution], failure_conditions: [missing_evidence]}
  - id: analysis.turnover_driver
    status: confirmed
    name: {en: Governed Turnover Driver Analysis, zh: 受治理成交额驱动分析}
    definition: Combines period facts, turnover change, segment contribution and a disclosed calendar-first non-causal decomposition.
    owner: actor.domain_owner
    sources: [source.requirements, source.metric_logic]
    decisions: [decision.segment_contribution, decision.decomposition]
    intent: turnover_driver
    operation: TurnoverDriverAnalysis
    required_metrics: [metric.eligible_turnover, metric.trading_day_count, metric.average_daily_turnover]
    required_dimensions: [dimension.period, dimension.segment]
    exactly_two_periods: true
    output_fields: [period_facts, turnover_change, segment_contribution, calendar_effect, activity_effect, residual]
    failure_conditions: [missing_period, segments_do_not_reconcile, non_closing_residual]

policies:
  - id: policy.aggregate_market_access
    status: confirmed
    name: {en: Aggregate Market Access, zh: 市场聚合访问策略}
    definition: Permits approved aggregate analysis and denies raw trade exposure.
    owner: actor.domain_owner
    sources: [source.requirements]
    allowed_roles: [MarketAnalyst, ExecutiveViewer]
    denied_roles: [ExternalUser]
    allowed_grains: [market-period, segment-period]
    denied_fields: [property.trade.trade_id, property.trade.instrument_id]
    minimum_group_size: 10

questions:
  - id: question.adt_fact
    status: confirmed
    name: {en: ADT Fact Question, zh: ADT事实问题}
    definition: Requests ADT for explicit periods.
    owner: actor.domain_owner
    sources: [source.requirements]
    examples: ["What was ADT in Q3 and Q4?", "2025年第三和第四季度的ADT是多少？"]
