processes:
  - id: process.adt_analysis
    status: confirmed
    name: {en: Governed ADT Analysis Process, zh: 受治理ADT分析流程}
    definition: End-to-end process from a user question through policy, semantic binding, deterministic execution, validation and evidence.
    owner: actor.domain_owner
    sources: [source.requirements]
    decisions: [decision.calendar_day, decision.eligible_trade, decision.decomposition]
    process_type: analysis
    trigger: An approved user submits an ADT fact, comparison, driver or evidence question.
    steps:
      - id: authorize
        name: Check role, requested grain and denied fields
        actor: actor.ontology_agent
        operation: PolicyGate
        governed_refs: [policy.aggregate_market_access]
        output_artifacts: [policy_decision]
        on_failure: refuse
      - id: bind
        name: Resolve periods, metrics and registered analysis pattern
        actor: actor.ontology_agent
        operation: SemanticBinding
        governed_refs: [metric.average_daily_turnover, dimension.period, analysis.metric_fact, analysis.period_compare, analysis.segment_contribution, analysis.sequential_decomposition, analysis.turnover_driver, analysis.evidence_audit]
        output_artifacts: [atomic_query_contracts, analysis_plan]
        on_failure: clarify
      - id: execute
        name: Compile approved mappings and execute aggregate queries
        actor: actor.ontology_agent
        operation: DeterministicExecution
        governed_refs: [source.trade_fact, source.trading_calendar, source.instrument_dim, join.trade_calendar, join.trade_instrument, rule.eligible_trade, rule.trading_day]
        output_artifacts: [aggregate_fact_set]
        on_failure: stop
      - id: verify
        name: Reconcile results and build claim-level evidence
        actor: actor.ontology_agent
        operation: VerifyAndEvidence
        governed_refs: [metric.eligible_turnover, metric.trading_day_count, metric.average_daily_turnover, analysis.sequential_decomposition]
        output_artifacts: [verified_facts, evidence_records, governed_answer]
        on_failure: stop
    exception_paths: [missing_period_to_clarification, denied_detail_to_refusal, validation_failure_to_no_answer]

