decisions:
- id: decision.source_classification
  question: What claim can be made from the supplied packet?
  options:
  - HKEX validated
  - Deloitte confirmed
  - Constructed synthetic only
  decision: Treat the case as constructed synthetic and illustrative only.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - scenario.cash_trading_activity_monitoring
  - source.order_activity
  - source.trading_activity
  - source.instrument_reference
  - source.account_reference
  - source.trading_calendar
  - source.order_type_reference
  - source.exchange_rate
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.cancel_spelling
  question: Which cancellation status spelling is canonical?
  options:
  - CANCELED
  - CANCELLED
  decision: Use CANCELED and accept CANCELLED only as an input alias.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.order.order_status
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.order_lifecycle
  question: What is the observed order lifecycle key?
  options:
  - order_id
  - venue/date/order
  - activity_id
  decision: Use venue_code + trading_date + order_id and disclose incomplete observed timelines.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - entity.order_activity
  - property.order.order_id
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.self_trade_candidate
  question: What constitutes the first demo self-trade candidate?
  options:
  - same normalized side participants
  - same account
  - business-defined surveillance model
  decision: Use same normalized buy and sell participant IDs as a triage candidate only.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.trade.has_both_participant_ids
  - property.trade.is_potential_self_trade
  - rule.potential_self_trade
  - metric.potential_self_trade_count
  - metric.potential_self_trade_rate
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.self_trade_denominator
  question: What is the potential self-trade rate denominator?
  options:
  - all trades
  - eligible active trades with both participant IDs
  - all order events
  decision: Use eligible active trades with both-side participant IDs.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - rule.self_trade_eligible
  - metric.self_trade_eligible_trade_count
  - metric.potential_self_trade_rate
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.trade_eligibility
  question: Which trade rows are eligible?
  options:
  - all rows
  - active TRADE rows
  - active rows excluding correction lineage
  decision: Use active TRADE rows and exclude cancel/bust/corrected originals.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.trade.is_eligible_trade
  - rule.eligible_trade
  - metric.eligible_trade_count
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.submitted_order
  question: What counts as a submitted order in an incomplete observed extract?
  options:
  - NEW events only
  - NEW or REJECT lifecycle
  - every observed lifecycle
  decision: Use one distinct venue + trading date + order ID lifecycle containing any NEW or REJECT event.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.order_lifecycle.is_submitted
  - rule.submitted_order
  - metric.submitted_order_count
  - metric.order_rejection_rate
  - metric.order_to_trade_ratio
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.rejected_order
  question: What counts as a rejected submitted order?
  options:
  - terminal state only
  - any REJECT event
  - any REJECT event or REJECTED state
  decision: Mark a submitted lifecycle rejected when any observed event is REJECT or has REJECTED state.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.order_lifecycle.is_rejected
  - rule.rejected_order
  - metric.rejected_order_count
  - metric.order_rejection_rate
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.client_classification
  question: What constitutes a client for the constructed-synthetic case?
  options:
  - participant_type=CLIENT
  - account_type=CLIENT
  - beneficial owner mapping
  decision: Use the effective account_reference row with participant_type=CLIENT; exclude unresolved participants.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.trade.is_active_client
  - property.order_lifecycle.is_client
  - rule.active_client_trade
  - rule.eligible_client_order
  - metric.active_client_trading_volume
  - metric.client_order_completion_rate
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.client_completion
  question: What is an eligible and completed client order?
  options:
  - latest FILLED among all client lifecycles
  - latest FILLED among submitted non-rejected client lifecycles
  - any fill event
  decision: Use submitted client lifecycles with no observed rejection as denominator and latest valid FILLED state as numerator.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.order_lifecycle.is_eligible_client_order
  - property.order_lifecycle.is_fully_filled
  - metric.eligible_client_order_count
  - metric.fully_filled_client_order_count
  - metric.client_order_completion_rate
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.cancel_ratio
  question: What is the cancel-to-trade numerator?
  options:
  - cancel events
  - distinct lifecycles containing CANCEL
  - terminal canceled lifecycles
  decision: Count distinct observed order lifecycles containing an eligible CANCEL event and divide by eligible active trades
    for the same cohort.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.order_lifecycle.is_canceled
  - rule.canceled_order
  - metric.canceled_order_count
  - metric.cancel_to_trade_ratio
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.order_to_trade
  question: What denominator convention applies to order-to-trade?
  options:
  - distinct trades
  - two times distinct active trades
  - execution events
  decision: Use two times distinct eligible active trades to represent the two matched sides in this synthetic case.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - metric.order_to_trade_denominator
  - metric.order_to_trade_ratio
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.latency_convention
  question: How is capture latency calculated and summarized?
  options:
  - average
  - nearest-rank percentiles
  - continuous percentiles
  decision: Use receive minus transaction timestamp in integer milliseconds, nearest-rank p50/p95/p99, and separate negative
    exceptions.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.trade.capture_latency_ms
  - property.trade.is_nonnegative_latency
  - rule.nonnegative_latency
  - metric.trade_capture_latency_ms
  - analysis.trade_latency_profile
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.notional_currency
  question: How are supplied notional fields labelled?
  options:
  - both HKD
  - native HKD and converted USD
  - USD only
  decision: Label trade_notional as HKD and base_notional_before_haircut as USD.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.trade.trade_notional_hkd
  - property.trade.base_notional_usd
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.calendar_key
  question: What is the logical calendar key?
  options:
  - business_date
  - calendar_code + business_date
  decision: Use calendar_code + business_date.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - property.calendar.calendar_key
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.time_convention
  question: How are source times interpreted?
  options:
  - already UTC
  - Hong Kong wall time then UTC
  - local only
  decision: Interpret source wall time as Asia/Hong_Kong, persist UTC, retain venue business date.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - scenario.cash_trading_activity_monitoring
  - property.trade.business_date
  - property.trade.transaction_timestamp
  - property.trade.receive_timestamp
  - property.order.trading_date
  - property.order.transaction_timestamp
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.demo_policy
  question: What access policy applies before production IAM exists?
  options:
  - all users all rows
  - demo role projection
  - no access
  decision: Apply the explicit synthetic-demo role projection and make no production IAM claim.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-20'
  affects:
  - policy.cash_surveillance_demo
  - policy.cash_markets_demo
  - process.cash_trading_analysis
  residual_assumption: Provisional synthetic decision; mapped to the versioned CT-ASM register and replaceable after external
    confirmation.
- id: decision.review_pack_baseline
  question: Which ontology semantics form the internally reviewed Cash Trading demo baseline?
  options:
  - Use the raw transcriptions only
  - Use the structured ontology review pack and preserve open confirmations
  - Treat blank review conclusions as external confirmation
  decision: Use the structured review pack as the internal baseline, preserve every blank conclusion as pending, and never
    claim Deloitte or HKEX confirmation.
  decided_by: actor.cash_trading_domain_owner
  decided_on: '2026-08-23'
  affects:
  - metric.order_rejection_rate
  - metric.order_fill_rate
  - metric.trade_capture_latency_ms
  - metric.active_client_trading_volume
  - metric.client_order_completion_rate
  - metric.cancel_to_trade_ratio
  - metric.order_to_trade_ratio
  - metric.potential_self_trade_rate
  - dimension.business_date
  - dimension.venue
  - dimension.market_segment
  - dimension.instrument
  - dimension.participant
  - dimension.participant_type
  - dimension.order_type
  - dimension.trading_session
  residual_assumption: This is an internally reviewed constructed-synthetic baseline. External review conclusions remain open.
