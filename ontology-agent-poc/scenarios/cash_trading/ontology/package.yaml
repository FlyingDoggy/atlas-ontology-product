- id: analysis.self_trade_summary
  version: 1.0.0
  status: confirmed
  name:
    en: Potential Self-Trade Summary
    zh: 潜在自成交汇总
  definition: Return eligible count, candidate count, rate and top candidate dimensions.
  owner: actor.cash_trading_domain_owner
  sources:
  - source.requirements
  - source.assumption_register
  decisions: []
  tags:
  - constructed_synthetic
  - cash_trading
  intent: anomaly_triage
  operation: cash.self_trade_summary
  required_metrics:
  - metric.self_trade_eligible_trade_count
  - metric.potential_self_trade_count
  - metric.potential_self_trade_rate
  required_dimensions: []
  exactly_two_periods: false
  output_fields:
  - eligible_trade_count
  - candidate_trade_count
  - candidate_rate_percent
  - candidate_participants
  - candidate_instruments
  - limitations
  failure_conditions:
