processes:
- id: process.cash_trading_analysis
  version: 1.0.0
  status: confirmed
  name:
    en: Governed Cash Trading Analysis
    zh: 受治理现金交易分析
  definition: From a natural-language question to a policy-scoped deterministic result and evidence-backed explanation.
  owner: actor.cash_trading_domain_owner
  sources:
  - source.requirements
  - source.assumption_register
  decisions:
  - decision.demo_policy
  - decision.source_classification
  tags:
  - constructed_synthetic
  - cash_trading
  process_type: analysis
  trigger: An authorized demo user asks a supported self-trade, latency or evidence question.
  steps:
  - id: authorize
    name: Resolve role, time window and output grain
    actor: actor.ontology_agent
    operation: PolicyGate
    governed_refs:
    - policy.cash_surveillance_demo
    - policy.cash_markets_demo
    output_artifacts:
    - policy_decision
    on_failure: refuse
  - id: bind
    name: Bind the question to a registered analysis pattern and metrics
    actor: actor.ontology_agent
    operation: SemanticBinding
    governed_refs:
    - analysis.self_trade_summary
    - analysis.self_trade_trend
    - analysis.self_trade_timeline
    - analysis.trade_latency_profile
    - analysis.cash_evidence_audit
    output_artifacts:
    - analysis_plan
    on_failure: clarify
  - id: execute
    name: Execute bounded DuckDB tools over verified Parquet
    actor: actor.ontology_agent
    operation: DeterministicExecution
    governed_refs:
    - source.cash_trade_analytics
    - rule.eligible_trade
    - rule.self_trade_eligible
    - rule.potential_self_trade
    - rule.nonnegative_latency
    output_artifacts:
    - verified_fact_set
    on_failure: stop
  - id: evidence
    name: Attach claims to metrics, decisions, data and query identities
    actor: actor.ontology_agent
    operation: EvidenceAssembly
    governed_refs:
    - analysis.cash_evidence_audit
    output_artifacts:
    - answer
    - claim_evidence
    - limitation_disclosure
    on_failure: stop
  exception_paths:
  - ambiguous_time_to_clarify
  - unsupported_suspicion_rule_to_clarify
  - misconduct_conclusion_to_refuse
  - unauthorized_detail_to_refuse
  - validation_failure_to_no_answer
