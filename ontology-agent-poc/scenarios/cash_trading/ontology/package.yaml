      data_type: string
      nullable: false
      description: Stable venue + trading date + order identifier.
    - name: trading_date
      data_type: date
      nullable: false
      description: Business date assigned to the observed lifecycle.
    - name: venue_code
      data_type: string
      nullable: false
      description: Normalized venue code.
    - name: market_segment
      data_type: string
      nullable: true
      description: Cash-market segment from the latest observed state.
    - name: instrument_id
      data_type: string
      nullable: false
      description: Instrument identifier from the latest observed state.
    - name: participant_id
      data_type: string
      nullable: true
      description: Participant identifier from the latest observed state.
    - name: is_client
      data_type: boolean
      nullable: false
      description: True when the effective participant reference is classified CLIENT.
    - name: is_submitted
      data_type: boolean
      nullable: false
      description: True when the lifecycle contains a NEW or REJECT submission attempt.
    - name: is_rejected
      data_type: boolean
      nullable: false
      description: True when any observed event rejects the submission.
    - name: is_eligible_client_order
      data_type: boolean
      nullable: false
      description: True for a submitted client lifecycle with no observed rejection.
    - name: is_fully_filled
      data_type: boolean
      nullable: false
      description: True when the latest valid observed state is FILLED.
    - name: is_canceled
      data_type: boolean
      nullable: false
      description: True when the lifecycle contains an eligible cancel event.
    - name: final_order_quantity
      data_type: integer
      nullable: false
      description: Order quantity at the latest valid observed state.
      unit: SHARE
    - name: final_cumulative_executed_quantity
      data_type: integer
      nullable: false
      description: Cumulative executed quantity at the latest valid observed state.
      unit: SHARE
