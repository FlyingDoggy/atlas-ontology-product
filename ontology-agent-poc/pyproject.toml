[project]
name = "atlas-ontology-agent-poc"
version = "0.3.0"
description = "Executable ontology-based analytic agent reference POC"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pyshacl>=0.30,<1",
  "PyYAML>=6,<7",
  "rdflib>=7,<8",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "openpyxl>=3.1,<4",
  "pyarrow>=21,<24",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[project.scripts]
ontology-agent = "ontology_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
