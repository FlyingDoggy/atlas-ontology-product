# Docker Compose service containers receive new IP addresses when recreated.
# Open-source Nginx 1.29 can re-resolve those service names when upstreams use
# a shared zone plus `resolve`. Kubernetes uses nginx.conf instead because its
# Service ClusterIPs are stable.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream runtime_dynamic {
    zone runtime_dynamic 64k;
    server runtime:8790 resolve;
}

upstream studio_dynamic {
    zone studio_dynamic 64k;
    server studio:8791 resolve;
}

upstream agent_control_dynamic {
    zone agent_control_dynamic 64k;
    server agent-control:8792 resolve;
}

upstream auth_dynamic {
    zone auth_dynamic 64k;
    server auth:8793 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    server_tokens off;
    # Match the Studio source contract. Nginx must not reject a valid source
    # before the application can apply its exact 20 MiB limit and archive checks.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive","service":"ontology-products-web"}';
    }

    location = /_auth_verify {
        internal;
        proxy_pass http://auth_dynamic/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /_auth_product {
        internal;
        proxy_pass http://auth_dynamic/auth/verify-product;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location ^~ /auth/ {
        proxy_pass http://auth_dynamic;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /login { return 308 /login/; }
    location ^~ /login/ {
        try_files $uri $uri/ /login/index.html =404;
    }

    location @login_redirect { return 302 /login/?next=$uri; }

    location /api/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        proxy_pass http://runtime_dynamic;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /control/ {
        auth_request /_auth_product;
        auth_request_set $atlas_user $upstream_http_x_atlas_user;
        auth_request_set $atlas_role $upstream_http_x_atlas_role;
        error_page 401 = @login_redirect;
        proxy_pass http://studio_dynamic;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Atlas-User $atlas_user;
        proxy_set_header X-Atlas-Role $atlas_role;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location /agent-control/ {
        auth_request /_auth_product;
        auth_request_set $atlas_user $upstream_http_x_atlas_user;
        auth_request_set $atlas_role $upstream_http_x_atlas_role;
        error_page 401 = @login_redirect;
        proxy_pass http://agent_control_dynamic;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Atlas-User $atlas_user;
        proxy_set_header X-Atlas-Role $atlas_role;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }

    location = / { return 302 /ontology-agent/; }
    location = /ontology-agent { return 308 /ontology-agent/; }
    location = /ontology-studio { return 308 /ontology-studio/; }

    location ^~ /assets/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store";
    }

    location ^~ /ontology-agent/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri /index.html;
    }

    location ^~ /ontology-studio/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri /index.html;
    }

    location / { return 404; }
}

server {
    listen 8081;
    server_name _;
    access_log off;
    error_page 500 502 504 =503 @probe_unavailable;

    location @probe_unavailable {
        return 503;
    }

    location = /_studio_ready {
        internal;
        proxy_pass http://studio_dynamic/control/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location = /readyz {
        auth_request /_studio_ready;
        proxy_pass http://runtime_dynamic/api/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location / { return 404; }
}
