[project]
name = "ontology-semantica-worker"
version = "0.1.0"
description = "Isolated Semantica proposal worker for Ontology Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "pydantic>=2.13,<3",
  "rdflib>=7.6,<8",
  "PyYAML>=6,<7",
  "uvicorn>=0.52,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_semantica_worker"]

