apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio
  labels:
    {{- include "ontology.labels" . | nindent 4 }}
    app.kubernetes.io/component: studio
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "ontology.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: studio
  template:
    metadata:
      labels:
        {{- include "ontology.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: studio
    spec:
      securityContext: {fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        {{- include "ontology.waitForRuntime" . | nindent 8 }}
      containers:
        - name: studio
          image: {{ include "ontology.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["ontology_agent.api:control_app", "--host", "0.0.0.0", "--port", "8791"]
          env:
            {{- include "ontology.backendEnv" . | nindent 12 }}
            {{- if .Values.llm.enabled }}
            - name: ONTOLOGY_STUDIO_LLM_MODE
              value: active-observation-canary
            - name: ONTOLOGY_MODEL_GATEWAY_URL
              value: http://model-gateway:8794
            {{- end }}
            {{- if .Values.semantica.enabled }}
            - name: ONTOLOGY_SEMANTICA_WORKER_URL
              value: http://semantica-worker:8795
            - name: ONTOLOGY_SEMANTICA_TIMEOUT_SECONDS
              value: {{ .Values.semantica.timeoutSeconds | quote }}
            {{- end }}
          ports: [{name: http, containerPort: 8791}]
          readinessProbe:
            httpGet: {path: /control/readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /control/healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "ontology.backendSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: published, mountPath: /app/published}
            - {name: studio-state, mountPath: /app/studio}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: published, persistentVolumeClaim: {claimName: ontology-published}}
        - {name: studio-state, persistentVolumeClaim: {claimName: ontology-studio-state}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
